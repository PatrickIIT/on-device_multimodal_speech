experiment:
  name: E7_streaming
  seed: 42
  description: "Streaming chunk-size evaluation and latency-accuracy trade-off study"

streaming:
  sample_rate: 16000
  chunk_sizes_ms:
    - 100
    - 200
    - 400
    - 800
    - 1000
  lookahead_ms: 0
  left_context_ms: 1600
  vad:
    enabled: true
    algorithm: energy_threshold
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 500

model:
  name: TBD
  architecture: streaming_conformer
  checkpoint_path: TBD

dataset:
  name: common_voice_swahili
  split_test: cv_sw_test.tsv
  manifest_dir: data/manifests

benchmarking:
  warmup_chunks: 5
  record_per_chunk_latency: true
